[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-long-term-memory"
version = "1.0.0"
description = "Offline long-term memory with provenance, BM25, and a compiled wiki."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
